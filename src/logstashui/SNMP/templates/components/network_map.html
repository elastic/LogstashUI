{% load static %}

<div class="bg-gray-800 rounded-lg shadow-xl overflow-hidden mb-6" id="networkMapCard">
  <div class="p-4 border-b border-gray-700 flex flex-wrap items-center gap-3">
    <div>
      <h2 class="text-xl font-bold text-white">
        Network Topology Map
        <span class="text-sm text-gray-400 font-normal ml-2">Visual representation of your network infrastructure</span>
      </h2>
    </div>
    <!-- Network filter controls -->
    <div class="ml-auto flex items-center gap-2" id="networkMapFilterRow">
      <label class="text-sm text-gray-400 whitespace-nowrap">Filter Networks:</label>
      <div class="relative" id="nmFilterWrapper">
        <button type="button" id="nmFilterTrigger"
                onclick="toggleNmFilterDropdown(event)"
                class="select select-bordered w-56 flex items-center gap-2 text-left h-auto min-h-[2.5rem] py-2 px-3">
          <span id="nmFilterLabel" class="flex-1 text-sm text-gray-400 truncate">All networks</span>
          <svg class="w-4 h-4 text-gray-400 shrink-0 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="nmFilterDropdown"
             class="hidden absolute right-0 z-[200] mt-1 w-72 bg-gray-800 border border-gray-600 rounded-lg shadow-xl">
          <div class="p-2 border-b border-gray-700">
            <input type="text" id="nmFilterSearch"
                   class="input input-sm w-full bg-gray-700 border-gray-600 text-white placeholder-gray-400 text-sm"
                   placeholder="Search networks…"
                   autocomplete="off"
                   oninput="filterNmDropdownOptions(this.value)"
                   onclick="event.stopPropagation()">
          </div>
          <div id="nmFilterOptions" class="max-h-52 overflow-y-auto py-1">
            <!-- Checkboxes injected by JS -->
            <p class="px-3 py-2 text-xs text-gray-500 italic">Loading…</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Loading State -->
  <div id="networkMapLoading" class="p-8 text-center">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
    <p class="text-gray-400 mt-2">Loading network topology...</p>
  </div>

  <!-- Network Map Container -->
  <div id="networkMapContainer" class="hidden p-6">
    <!-- Map will be rendered here by JavaScript -->
  </div>

  <!-- Empty State -->
  <div id="networkMapEmpty" class="hidden p-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-700/50 rounded-full mb-4">
      <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
      </svg>
    </div>
    <h3 class="text-lg font-semibold text-white mb-2">No Network Data Available</h3>
    <p class="text-gray-400">Add devices and networks to visualize your topology.</p>
  </div>
</div>

<!-- Device preview template (required by snmp_device_visual_preview.js) -->
{% include 'components/snmp_device_visual_preview.html' %}

<!-- Styles for floating device detail windows and compact node cards -->
<style>
/* ── Full device detail windows ── */
.device-window .resize-handle { position: absolute; z-index: 10; }
.device-window .resize-handle-n  { top: 0;    left: 0;   right: 0;  height: 5px; cursor: ns-resize;   }
.device-window .resize-handle-s  { bottom: 0; left: 0;   right: 0;  height: 5px; cursor: ns-resize;   }
.device-window .resize-handle-e  { top: 0;    right: 0;  bottom: 0; width:  5px; cursor: ew-resize;   }
.device-window .resize-handle-w  { top: 0;    left: 0;   bottom: 0; width:  5px; cursor: ew-resize;   }
.device-window .resize-handle-ne { top: 0;    right: 0;  width: 10px; height: 10px; cursor: nesw-resize; }
.device-window .resize-handle-nw { top: 0;    left: 0;   width: 10px; height: 10px; cursor: nwse-resize; }
.device-window .resize-handle-se { bottom: 0; right: 0;  width: 10px; height: 10px; cursor: nwse-resize; }
.device-window .resize-handle-sw { bottom: 0; left: 0;   width: 10px; height: 10px; cursor: nesw-resize; }
.device-window .window-header    { user-select: none; -webkit-user-select: none; }

/* ── Compact topology node card ── */
.node-card { transition: box-shadow 0.15s ease; }
.node-card:hover { box-shadow: 0 0 0 1px rgba(96,165,250,0.3), 0 8px 30px rgba(0,0,0,0.5); }
.node-card .nc-header { user-select: none; -webkit-user-select: none; }

/* ── Network filter dropdown checkboxes ── */
.nm-filter-option {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; cursor: pointer;
    transition: background-color 0.1s;
}
.nm-filter-option:hover { background: rgba(255,255,255,0.05); }
.nm-filter-option input[type="checkbox"] { accent-color: #3b82f6; width: 14px; height: 14px; shrink: 0; }
</style>

<script src="{% static 'js/network_map.js' %}"></script>
<script src="{% static 'js/snmp_device_visual_preview.js' %}"></script>

<script>
/* Bootstrap the network map after scripts load */
document.addEventListener('DOMContentLoaded', function() {
    initNetworkMap();
});
</script>
