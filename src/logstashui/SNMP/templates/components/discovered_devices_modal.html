<!-- Discovered Devices Modal -->
<div id="discoveredDevicesModal" class="hidden fixed inset-0 overflow-hidden z-50">
  <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeDiscoveredDevicesModal()"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-lg shadow-xl max-w-6xl w-full max-h-[90vh] overflow-hidden flex flex-col">
      <!-- Modal Header -->
      <div class="flex justify-between items-center p-6 border-b border-gray-700">
        <div>
          <h2 class="text-xl font-bold text-white">Discovered Devices</h2>
          <p class="text-sm text-gray-400 mt-1">Devices discovered via SNMP in the last 10 minutes</p>
        </div>
        <button onclick="closeDiscoveredDevicesModal()" class="text-gray-400 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="flex-1 overflow-y-auto p-6">
        {% include 'components/discovered_devices_content.html' %}
      </div>

      <!-- Modal Footer -->
      <div class="border-t border-gray-700 p-6">
        <div class="flex justify-between items-center">
          <div class="text-sm text-gray-400">
            <span id="discoveredDevicesCount">0</span> device(s) found
          </div>
          <button onclick="closeDiscoveredDevicesModal()" class="btn btn-secondary">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
