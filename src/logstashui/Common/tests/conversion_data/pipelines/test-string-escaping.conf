input {
}
filter {
	mutate {
		add_field => {
			"double_quoted_with_hash" => "value # not a comment"
			"with_brackets" => "data [in] brackets {and} braces"
			"with_arrow" => "key => value pattern"
			"env_ref" => "${MY_VAR}"
			"sprintf_ref" => "prefix-%{field_name}"
		}
	}
	grok {
		match => {
			"message" => '%{IP:client} \[%{HTTPDATE:ts}\] "%{WORD:method} %{URIPATHPARAM:path}'
		}
		pattern_definitions => {
			"CUSTOM_IP" => "\b(?:\d{1,3}\.){3}\d{1,3}\b"
		}
	}
	mutate {
		rename => {
			"@timestamp" => "event_time"
			"host" => "source_host"
		}
	}
}
output {
	file {
		path => "/var/log/output/%{type}/%{+YYYY}/%{+MM}/%{+dd}.log"
		codec => json
	}
}
