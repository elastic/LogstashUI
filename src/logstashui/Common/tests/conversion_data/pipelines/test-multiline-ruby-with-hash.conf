input {
	stdin {
		codec => line
	}
}
filter {
	ruby {
		code => '
	require "digest"
	msg = event.get("message").to_s
	event.set("hash", Digest::MD5.hexdigest(msg))
	# this # is NOT a comment — it is inside a single-quoted string
	if event.get("level") == "ERROR"
		event.set("alert", true)
		event.set("severity", "high")
	elsif event.get("level") == "WARN"
		event.set("severity", "medium")
	else
		event.set("severity", "low")
	end
	# another hash # mark inside the string — still not a comment
			'
	}
	ruby {
		init => '
	require "openssl"
	require "base64"
	# init comment inside single-quoted string
	@secret = ENV["SIGNING_SECRET"] || "default"
			'
		code => '
	payload = event.get("message").to_s
	sig = Base64.strict_encode64(
		OpenSSL::HMAC.digest("SHA256", @secret, payload)
	)
	event.set("signature", sig)
			'
	}
	mutate {
		add_field => {
			"pipeline" => "ruby-test"
		}
	}
}
output {
	stdout {
		codec => rubydebug
	}
}
