 *
 * Show-once display. The raw token is never stored in plaintext, so this is
 * the only opportunity to copy it.
-->

<div class="space-y-4">
  <div class="p-4 bg-green-500/10 border border-green-500/50 rounded-lg text-green-300 text-sm">
    Token <strong>{{ token.name }}</strong> created. Copy it now — it cannot be shown again.
  </div>

  <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
    <div class="flex justify-between items-center mb-2">
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Token</span>
      <button type="button" id="copyTokenBtn"
              onclick="copyNewToken(this)"
              class="btn btn-xs btn-primary">
        Copy
      </button>
    </div>
    <code id="newTokenValue" class="block font-mono text-xs text-gray-200 break-all">{{ raw_token }}</code>
  </div>

  <p class="text-sm text-gray-400">
    See the
    <a href="/Documentation/logstashui/rest_api/"
       class="text-blue-400 hover:text-blue-300 underline"
       target="_blank" rel="noopener">REST API documentation</a>
    for how to use this token.
  </p>

  <div class="flex justify-end">
    <button type="button" onclick="window.location.reload();" class="btn btn-primary">Done</button>
  </div>
</div>
