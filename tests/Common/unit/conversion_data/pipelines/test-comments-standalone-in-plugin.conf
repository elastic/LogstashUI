input {
}
filter {
	mutate {
		# This is a standalone comment at the top of a plugin block
		# Standalone comment in the middle of a plugin block
		# Another standalone at the bottom
		add_field => {
			"field1" => "value1"
		}
		remove_field => ["junk"]
	}
	grok {
		# Standalone comment before the only config key
		# Standalone at the end of plugin
		match => {
			"message" => "%{COMBINEDAPACHELOG}"
		}
	}
	# Section-level comment between plugins
	mutate {
		# Leading standalone
		# Second leading standalone
		# Trailing standalone
		uppercase => ["log_level"]
	}
}
output {
}
