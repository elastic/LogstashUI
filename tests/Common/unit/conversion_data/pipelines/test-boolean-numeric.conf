input {
	tcp {
		port => 5000
		ssl_enable => "false"
		buffer_size => 65536
	}
	udp {
		port => 514
		queue_size => 2000
		workers => 4
	}
}
filter {
	grok {
		match => {
			"message" => "%{NUMBER:duration:float} %{NUMBER:status:int}"
		}
		keep_empty_captures => "false"
		tag_on_failure => ["_grokfailure"]
		timeout_millis => 30000
		break_on_match => "true"
	}
	mutate {
		convert => {
			"duration" => "float"
			"status" => "integer"
			"bytes" => "integer"
		}
	}
	if [duration] > 1.5 {
		mutate {
			add_field => {
				"slow_request" => "true"
			}
		}
	}
	if [status] >= 500 {
		mutate {
			add_field => {
				"is_error" => "true"
				"error_code" => 500
				"threshold_pct" => 0.99
			}
		}
	}
	throttle {
		before_count => 3
		after_count => 1
		period => 60
		key => "%{host}"
		add_tag => ["throttled"]
	}
}
output {
	stdout {
		codec => rubydebug
	}
}
