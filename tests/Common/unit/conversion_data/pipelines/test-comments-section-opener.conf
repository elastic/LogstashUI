input {
	# inline comment on input opener
	beats {
		# inline on beats opener
		port => 5044
	}
}
filter {
	# inline comment on filter opener
	mutate {
		add_field => {
			"processed" => "true"
		}
	}
	# standalone comment between plugins at section level
	drop {
	}
}
output {
	# inline comment on output opener
	elasticsearch {
		hosts => ["localhost:9200"]
		index => "logs-%{+YYYY.MM.dd}"
	}
	# standalone at section level before second output plugin
	stdout {
		codec => rubydebug
	}
}
