input {
	stdin {
	}
}
filter {
	# Top-level comment before any conditional
	if [type] == "web" {
		# Comment inside first if branch
		if [status] >= 500 {
			# Comment inside nested if
			mutate {
				add_tag => ["server_error"]
				add_field => {
					"severity" => "high"
				}
			}
			# Comment after plugin inside nested if
			if [status] == 503 {
				mutate {
					add_tag => ["service_unavailable"]
				}
			}
			# Trailing comment inside nested if
		}
		else if [status] >= 400 {
			# Comment inside else-if
			mutate {
				add_tag => ["client_error"]
				add_field => {
					"severity" => "medium"
				}
			}
			# Trailing comment inside else-if
		}
		else {
			# Comment inside else
			mutate {
				add_tag => ["success"]
				add_field => {
					"severity" => "low"
				}
			}
		}
		# Comment at end of outer if block
	}
	else if [type] == "db" {
		# Comment at start of else-if block
		mutate {
			add_field => {
				"source" => "database"
			}
		}
	}
	else {
		# Comment in final else
		drop {
		}
	}
	# Comment between conditional and next plugin at section level
	mutate {
		add_field => {
			"processed_by" => "logstash"
		}
	}
	# Trailing section-level comment
}
output {
	stdout {
		codec => rubydebug
	}
}
