input {
	# inline on section opener
	udp {
		# standalone inside plugin
		# add_field => {"commented_out" => "value"} standalone with braces
		# inline on plugin opener
		# inline on scalar value
		# inline on array
		port => 5140
		buffer_size => 65536
		tags => ["syslog"]
	}
	# inline on plugin closer -> section comment
}
filter {
	# inline on filter opener
	# standalone at section level
	mutate {
		# standalone before first pair
		# standalone between pairs
		# standalone at end of plugin
		# inline on mutate opener
		# inline on hash opener
		# inline on hash pair
		# inline on hash closer
		# inline on array pair
		add_field => {
			"key1" => "value1"
			"key2" => "value2"
		}
		remove_field => ["old"]
	}
	# inline on plugin closer -> section comment
	# standalone between plugins
	if [type] == "web" {
		# standalone inside conditional
		grok {
			# standalone inside nested plugin
			# match => {"message" => "%{GREEDYDATA}"} standalone with braces in conditional
			# inline on nested plugin opener
			# inline inside nested hash
			# inline on nested hash closer
			match => {
				"message" => "%{COMBINEDAPACHELOG}"
			}
		}
		# inline on nested plugin closer
		# standalone at end of conditional block
	}
	drop {
	}
}
output {
	stdout {
		codec => rubydebug
	}
}
