name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches pyproject version
        id: extract_version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(python3 -c "import sys, tomllib; print(tomllib.load(sys.stdin.buffer)[sys.argv[1]][sys.argv[2]])" project version < pyproject.toml)
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Version mismatch: tag v$TAG_VERSION does not match pyproject.toml version $PYPROJECT_VERSION" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  pypi-publish:
    needs: [check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      # PyPI publishing will be activated once OIDC Trusted Publishing is
      # configured for this repository and workflow.
      - name: PyPI publish placeholder
        run: echo "PyPI publishing will be activated once OIDC Trusted Publishing is configured."
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1

  docker-publish:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/logstashui:${{ needs.check-version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/logstashui:latest

  offline-release-assets:
    needs: [check-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Freeze offline artifacts
        run: bash bin/freeze_logstashui.sh --all
      - name: Upload offline archives to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/offline/logstashui-*-offline-wheels-linux-x86_64-cp312.zip
            dist/offline/logstashui-*-offline-docker-linux-x86_64.zip
