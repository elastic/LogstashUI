name: Database matrix

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run database matrix
        run: bash bin/test_databases.sh
