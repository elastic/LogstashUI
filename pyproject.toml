[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LogstashUI"
version = "0.5.1"
description = "A control plane and UI for Logstash!"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46.0.6",
    "django>=6.0.3",
    "django-browser-reload>=1.21.0",
    "django-htmx>=1.27.0",
    "django-login-required-middleware>=0.9.0",
    "django-tailwind>=4.4.2",
    "elasticsearch>=9.3.0",
    "gevent>=26.4.0",
    "gunicorn>=25.3.0",
    "lark>=1.3.1",
    "markdown>=3.10.2",
    "packaging>=26.0",
    "pygrok>=1.0.0",
    "pysnmp>=7.1.26",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "whitenoise>=6.12.0",
]

[project.scripts]
logstashui = "LogstashUI.cli:main"

[project.urls]
Homepage = "https://github.com/elastic/LogstashUI"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
mysql = [
    "PyMySQL>=1.1.1",
]
databases = [
    "psycopg[binary]>=3.2.0",
    "PyMySQL>=1.1.1",
]

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
include = [
  "src/logstashui",
  "docs/docs",
  "docs/images",
  "CHANGELOG.md",
  "README.md",
  "LICENSE.txt",
  "NOTICE.txt",
  "pyproject.toml",
]
exclude = [
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/htmlcov/**",
  "**/graphify-out/**",
  "**/*.pyc",
]

[tool.hatch.build.targets.sdist.force-include]
"src/logstashui/theme/static/css/dist/styles.css" = "src/logstashui/theme/static/css/dist/styles.css"

[tool.hatch.build.targets.wheel]
exclude = [
  "**/node_modules/**",
]

[tool.hatch.build.targets.wheel.force-include]
"src/logstashui/LogstashUI" = "LogstashUI"
"src/logstashui/PipelineManager" = "PipelineManager"
"src/logstashui/Management" = "Management"
"src/logstashui/Utilities" = "Utilities"
"src/logstashui/SNMP" = "SNMP"
"src/logstashui/Monitoring" = "Monitoring"
"src/logstashui/Site" = "Site"
"src/logstashui/Documentation" = "Documentation"
"src/logstashui/AI" = "AI"
"src/logstashui/theme" = "theme"
"src/logstashui/Common" = "Common"
"docs/docs" = "Documentation/content/docs"
"docs/images" = "Documentation/content/images"
"CHANGELOG.md" = "Documentation/content/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.10.0",
    "testcontainers[postgres]>=4.8.0",
    "testcontainers[mysql]>=4.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "LogstashUI.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["src/logstashui"]
testpaths = ["src/logstashui", "tests"]
markers = [
    "integration: marks tests that require running Docker containers",
]
addopts = [
  "--import-mode=importlib",
  "--cov",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-report=html",
]

[tool.coverage.run]
source = ["logstashui"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
]
