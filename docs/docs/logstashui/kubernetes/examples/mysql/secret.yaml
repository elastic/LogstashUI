apiVersion: v1
kind: Secret
metadata:
  name: logstashui
  namespace: logstashui
type: Opaque
stringData:
  SECRET_KEY: CHANGE-ME-generate-a-django-secret-key
  LOGSTASHUI_DB_PASSWORD: CHANGE-ME
  # Shared with Deployment/logstashagent so the embedded node can CSR without enroll.
  # Must match what the agent reads. Do not use the default in a real cluster.
  LOGSTASHUI_AGENT_CSR_SECRET: CHANGE-ME-shared-with-the-agent
  # Key the UI presents to Deployment/logstashagent's /_logstash/* API.
  # Must match the agent's LOGSTASH_AGENT_API_KEY. Generate a long random value.
  LOGSTASH_AGENT_API_KEY: CHANGE-ME-shared-with-the-agent-api
