apiVersion: v1
kind: Secret
metadata:
  name: logstashui
  namespace: logstashui
type: Opaque
stringData:
  SECRET_KEY: CHANGE-ME-generate-a-django-secret-key
  LOGSTASHUI_DB_PASSWORD: CHANGE-ME
  # Shared with Deployment/logstashagent so the embedded node can CSR without enroll.
  # Uncomment when applying examples/embedded-agent.yaml. Must match what the
  # agent reads. Do not use the compose default in a real cluster.
  # LOGSTASHUI_AGENT_CSR_SECRET: CHANGE-ME-shared-with-the-agent
