# Local smoke override: build from source instead of Docker Hub images.
# Usage (from docker/):
#   # inject Docker host hostname + LAN IPs into UI cert SANs:
#   export LOGSTASHUI_HOST_HOSTNAME="$(hostname -f 2>/dev/null || hostname)"
#   export LOGSTASHUI_HOST_IPS="$(ifconfig 2>/dev/null | awk '/inet / && $2 != "127.0.0.1" {print $2}' | paste -sd, -)"
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml --profile embedded up -d --build
# Or use ../../bin/start_logstashui.sh which sets these automatically.

services:
  logstashui:
    image: logstashui:smoke
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: never

  logstashagent:
    image: logstash-agent:smoke
    build:
      context: ../../LogstashAgent
      dockerfile: docker/Dockerfile
    pull_policy: never
