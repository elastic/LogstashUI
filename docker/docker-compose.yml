name: LogstashUI

# Dual HTTPS (no nginx):
#   UI gunicorn  :8443  (product CA leaf or custom upload under $LOGSTASHUI_DATA_DIR/tls/)
#   Agent uvicorn :9500 (product-CA-signed agent leaf; CSR issue via enroll/check-in/secret)
# Agents pull product CA from https://…:8443/.well-known/logstashui/ca.crt (verify=False only for that bootstrap GET).
# Host checkout bind: <project_root>/logstashui_data → /var/lib/logstashui

services:
  logstashui:
    # Default: published Hub image. Local source + TLS/callback fixes require:
    #   docker compose -f docker-compose.yml -f docker-compose.smoke.yml --profile embedded up -d --build
    # or:  ../../bin/start_logstashui.sh --rebuild
    # Plain `docker compose up --build` does NOT rebuild from this tree (no build: here).
    image: codyjackson032/logstashui:latest
    ports:
      - "8443:8443"
    volumes:
      - ../logstashui_data:/var/lib/logstashui
      - ../src/logstashui/logstashui.yml:/app/src/logstashui/logstashui.yml:ro
    environment:
      - DEBUG=False
      - LOGSTASHUI_DATA_DIR=/var/lib/logstashui
      # Linux bind-mount: start_logstashui.sh sets these to the host uid/gid so
      # ./logstashui_data stays owned by the operator. Empty → image appuser (10001).
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      # SECRET_KEY: Optional - will auto-generate and persist in DATA_DIR/.django_secret_key if not set
      # - SECRET_KEY=${SECRET_KEY}
      # ALLOWED_HOSTS: Set to your domain(s) in production (comma-separated)
      # Example: ALLOWED_HOSTS=yourdomain.com,www.yourdomain.com,192.168.1.100
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
      # Shared with embedded agent so it can obtain a server cert without enroll
      - LOGSTASHUI_AGENT_CSR_SECRET=${LOGSTASHUI_AGENT_CSR_SECRET:-logstashui-compose-dev}
      # LOGSTASH_AGENT_URL: HTTPS direct to agent (no nginx)
      # Host mode: https://host.docker.internal:9501
      # Embedded: https://logstashagent:9500
      - LOGSTASH_AGENT_URL=${LOGSTASH_AGENT_URL:-https://logstashagent:9500}
      # Host identity for product UI cert SANs (set by start_logstashui.sh or manually).
      # Containers cannot see the Docker host's LAN IPs without this injection.
      - LOGSTASHUI_HOST_HOSTNAME=${LOGSTASHUI_HOST_HOSTNAME:-}
      - LOGSTASHUI_HOST_IPS=${LOGSTASHUI_HOST_IPS:-}
      # Optional extra SANs: comma-separated DNS names and/or IPs
      - LOGSTASHUI_TLS_SANS=${LOGSTASHUI_TLS_SANS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import ssl,urllib.request; ctx=ssl._create_unverified_context(); urllib.request.urlopen('https://127.0.0.1:8443/.well-known/logstashui/ca.crt', context=ctx, timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - logstashui_network

  logstashagent:
    image: codyjackson032/logstash-agent:latest
    profiles:
      - embedded  # Only start this container in embedded mode
    ports:
      - "9650:9650"  # Logstash API (legacy image mapping; runtime often 9560)
      - "9560:9560"  # Logstash API (embedded default)
      - "9449:9449"  # Logstash HTTP input (for sample events)
      - "9500:9500"  # FastAPI agent API (HTTPS)
    depends_on:
      logstashui:
        condition: service_healthy
    environment:
      # UI base for product CA bootstrap + CSR issue (HTTPS only)
      - LOGSTASH_UI_URL=https://logstashui:8443
      # StreamSimulate / Logstash callbacks into UI HTTPS
      - LOGSTASH_URL=https://logstashui:8443
      - SIMULATION_MODE=true
      - LOGSTASHUI_AGENT_CSR_SECRET=${LOGSTASHUI_AGENT_CSR_SECRET:-logstashui-compose-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - logstashui_network

networks:
  logstashui_network:
